# Container-service variant. Per /docs/compose, services behind an app auth policy
# receive X-Kedge-Auth-Subject / -Email / -Provider / -Assertion headers.
# traefik/whoami echoes every request header it receives, so the page itself shows
# exactly what the container was given.
services:
  web:
    image: traefik/whoami
    ports: ["80"]
x-kedge:
  auth:
    google: true
    github: true
